<!-- 操作に対するエラーなどをまとめるマクロのHTMLを記述 -->
{% macro render_field(field) %}
<dt>{{ field.label }}
    <dd>{{ field(**kwargs)| safe }}
        {% if field.errors %}
        <ul class="errors">
        <!-- field.errorsの中身をerrorとして繰り返し表示する -->
            {% for error in field.errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    </dd>
</dt>
{% endmacro %}
