<!DOCTYPE html>
<html lang ="ja">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>チャット画面top</title>
        <link rel="stylesheet" href="../static/css/chat_top.css"/>
    </head>

    <body>
        <!--ヘッダー情報-->
        <header id="chat-header">
            <image src="../static/img/image_お皿.png"alt="アプリのアイコン画像">
            <p class="chat-name">{{ users.family_name }}</p>
            <a href="chat_menu.html"><image src="../static/img/image_メニューバー.png"alt="メニューバー画像"></a>
        </header>

        <!--チャット送信機能／チャット履歴を表すエリア-->
        <main id="chat-main">
            <!--チャット履歴表示画面-->
            <p class="user-name">{{ users.user_name}}</p>
            <ul class="message">
                {% for message in messages}
                    <li>{{ messages.content}}</li>
                {% endfor %}
            </ul>


            <!--チャット送信機能-->
            <div class="message-type-area">
                <form action="{{ url_for( 'create_messages', family_id=Family_id )}}" method=POST>
                    <textarea placeholder="文字を入力する"></textarea>
                    <button type="submit" name="button"value="blank">
                        <form>　</form>
                    </button>
                </form>
            </div>
            
        </main>


    </body>




</html>
