{% extends 'base.html' %}
{% block title %}
<title>login</title>
{% endblock %}

{% block body %}
<div class="auth-wrapper">
    <div class="auth-container">
        <a href="javascript:history.back()" class="back-button">
            <img src="{{ url_for('static', filename='img/image_戻る.png') }}">
        </a>
        <img src="{{ url_for('static', filename='img/image_アプリ名.png') }}">
        <form class="auth-form" method="post">
            <h1 class="auth-title">ログイン</h1>

            <div class="auth-logo">
                <img src="{{ url_for('static', filename='img/image_お皿.png') }}">
            <div>
                <label for="email-input">メールアドレス</label>
                <input type="text" placeholder="Email" name="email" id="email-input" />
            </div>
            <div>
                <label for="password-input">パスワード</label>
                <input type="password" placeholder="Password" name="password" id="password-input" />
            </div>
            
            <div class="auth-button-container">

                {% with messages = get_flashed_messages() %} {% if messages %}
                <ul class="flashes">
                    {% for message in messages %}
                    <li>{{ message }}</li>
                    {% endfor %}
                </ul>
                {% endif %} {% endwith %}
                
                <button class="auth-button " type="submit">ログイン</button>
            </div>
        
        </form>     
    </div>  
</div>
{% endblock %}
