{% extends 'base.html' %}
{% block title %}
<title>history</title>
{% endblock %}

{% block body %}

  <!--ヘッダー情報-->
  <!-- {% include 'header.html' %} -->
  <header id="chat-header">
  <image src="{{ url_for('static', filename='img/image_お皿.png') }}"alt="アプリのアイコン画像">
      <p class="chat-name">{{ family_name }}</p>
      <a href="chat_menu.html"><image src="{{ url_for('static', filename='img/image_メニューバー.png') }}"alt="メニューバー画像"></a>
  </header>

<h3>ごはん履歴</h3>
<div>
  {% for history in histories %}
    <li>{{ history.menu }}
        {{ history.created_at.strftime("%m/%d") }}
        ({{ WEEKDAYS[history.created_at.weekday()]}})
        </li>
  {% endfor %}
</div>

{% endblock %}
