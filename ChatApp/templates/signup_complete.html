{% extends 'base.html' %}

{% block body %}
<div class="auth-wrapper">
    <div class="auth-container">
        
        <div class="container">
            <img src="{{ url_for('static', filename='img/image_アプリ名.png') }}">
        </div>

        <div class="icon">
            <img src="{{ url_for('static', filename='img/image_お皿.png') }}">
            <p class="description">管理者アカウント<br>作成が完了しました</p>

            <!-- 1つ目のボタン -->
            <button style="margin-bottom: 20px;"> <!-- ボタン間の余白を調整するならstyle属性で一時的に指定 -->
                <a href="{{ url_for('messages_view', family_id=current_user.family_id) }}">チャットルーム<br>へ移動</a>
                <!-- messages_viewにはfamily_idが必要なので、適切な値を渡してね -->
            </button>

            <!-- 2つ目のボタン -->
            <button class="white-button">
                <a href="{{ url_for('signup_family_view') }}">家族アカウント作成<br>を作成する</a>
            </button>
        </div>
    </div>
</div>
{% endblock %}
